<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>WebAR 記念写真テスト</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;color:#fff}
  #camerafeed{position:fixed;inset:0;width:100%;height:100%}
  .ui{position:fixed;left:0;right:0;z-index:10;display:flex;justify-content:center;pointer-events:none}
  #hint{top:max(16px,env(safe-area-inset-top));}
  #hint span{background:rgba(0,0,0,.55);padding:10px 16px;border-radius:999px;font-size:15px}
  #bar{bottom:max(24px,env(safe-area-inset-bottom));gap:18px;align-items:center}
  button{pointer-events:auto;border:0;font:inherit;cursor:pointer}
  #shutter{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.45)}
  #shutter:active{transform:scale(.92)}
  .sub{background:rgba(0,0,0,.55);color:#fff;padding:12px 16px;border-radius:999px;font-size:14px;min-height:44px}
  #result{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
  #result img{max-width:100%;max-height:68vh;border-radius:12px}
  #result p{margin:0;font-size:14px;opacity:.85;text-align:center}
  #result .row{display:flex;gap:12px}
  .main{background:#ff7a59;color:#fff;padding:14px 22px;border-radius:999px;font-size:16px;min-height:44px}
  #sizeMode{position:fixed;left:12px;top:max(56px,calc(env(safe-area-inset-top) + 44px));z-index:12}
  #size{position:fixed;right:12px;top:max(16px,env(safe-area-inset-top));z-index:11;display:none;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:999px;font-size:13px}
  #credit{position:fixed;left:8px;bottom:4px;z-index:11;font-size:10px;opacity:.7}
  #credit a{color:#fff}
  #intro{position:fixed;inset:0;z-index:40;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center}
  #intro h2{margin:0;font-size:22px}
  #intro p{margin:0;font-size:15px;line-height:1.6;opacity:.9}
  #intro ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;text-align:left}
  #intro li{background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
  #intro li b{display:block;font-size:16px}
  #intro li.now{outline:2px solid #ff7a59}
  #intro li.done{opacity:.5}
  #geoGate{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
  #geoGate h2{margin:0;font-size:20px}
  #geoGate p{margin:0;font-size:15px;line-height:1.6;opacity:.9}
  #geoInfo{position:fixed;left:12px;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 92px);z-index:11;display:none;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<canvas id="camerafeed"></canvas>

<div class="ui" id="hint"><span id="hintText">スマホをゆっくり左右に動かして、床を映してください</span></div>
<div class="ui" id="bar">
  <button class="sub" id="reset">置き直す</button>
  <button id="shutter" aria-label="写真を撮る"></button>
  <button class="sub" id="mode">3Dにする</button>
</div>
<div id="size">身長 約155cm</div>
<button class="sub" id="sizeMode">卓上サイズにする</button>

<div id="result">
  <img id="photo" alt="撮った写真">
  <p id="saveHint">画像を長押しすると保存できます</p>
  <div class="row">
    <button class="main" id="share">保存・共有</button>
    <button class="sub" id="close">もう一枚撮る</button>
  </div>
</div>

<div id="intro">
  <h2>体験を始める前に</h2>
  <p>このあと、スマホから確認が出ます。<br>すべて「許可」を押してください。</p>
  <ol id="introList"></ol>
  <button class="main" id="introStart">はじめる</button>
</div>
<div id="geoGate"><h2 id="geoTitle">位置を確認しています</h2><p id="geoMsg">位置情報の利用を「許可」してください</p><button class="main" id="geoRetry" style="display:none">もう一度確認する</button></div>
<div id="geoInfo"></div>

<div id="credit">Powered by 8th Wall Engine © Niantic Spatial, Inc. <a href="https://github.com/8thwall/engine/blob/main/LICENSE">License</a></div>

<script>
  const CHAR_PARAM = new URLSearchParams(location.search).get('c')
  // ?debug=1 のときだけ、距離や身長などの確認用の表示を出す（本番では出さない）
  const DEBUG = new URLSearchParams(location.search).get('debug') === '1'
{
  // ---- 仮のキャラクター（温泉むすめの代わり。頭にタオルをのせた湯けむりの子）----
  const makeCharacter = () => {
    const g = new THREE.Group()
    const mat = (c) => new THREE.MeshStandardMaterial({color: c, roughness: 0.7})
    const skin = mat(0xffe0c8), robe = mat(0x5b7fd6), towel = mat(0xffffff), dark = mat(0x333333), cheek = mat(0xff9aa2)

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.26, 0.6, 24), robe)
    body.position.y = 0.42
    const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.06, 24), mat(0xd94f4f))
    belt.position.y = 0.5
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 24), skin)
    head.position.y = 0.92
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.205, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.55), mat(0x3a2a22))
    hair.position.y = 0.93
    hair.rotation.x = -0.35
    const tw = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.07, 0.16), towel)
    tw.position.set(0, 1.12, 0)
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.025, 12, 8), dark)
    const eyeR = eyeL.clone()
    eyeL.position.set(-0.07, 0.94, 0.18)
    eyeR.position.set(0.07, 0.94, 0.18)
    const chL = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 8), cheek)
    const chR = chL.clone()
    chL.position.set(-0.11, 0.88, 0.16)
    chR.position.set(0.11, 0.88, 0.16)
    chL.scale.z = chR.scale.z = 0.4

    const armL = new THREE.Group()
    const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.32, 12), robe)
    armMesh.position.y = -0.16
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), skin)
    hand.position.y = -0.33
    armL.add(armMesh, hand)
    armL.position.set(-0.2, 0.68, 0)
    armL.rotation.z = -0.25
    const armR = armL.clone()
    armR.position.x = 0.2

    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(0.3, 32),
      new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.25})
    )
    shadow.rotation.x = -Math.PI / 2
    shadow.position.y = 0.005

    g.add(body, belt, head, hair, tw, eyeL, eyeR, chL, chR, armL, armR, shadow)
    g.userData = {armR, inner: [body, belt, head, hair, tw, eyeL, eyeR, chL, chR, armL, armR]}
    g.traverse(o => { if (o.isMesh && o !== shadow) o.castShadow = true })
    return g
  }

  // ---- 2Dのキャラ（立ち絵をパネルにして立たせる）----
  // 温泉むすめの立ち絵（透過PNG）に差し替える想定の、仮のイラスト
  const drawGirl = () => {
    const c = document.createElement('canvas')
    c.width = 512; c.height = 1024
    const x = c.getContext('2d')
    const ell = (cx, cy, rx, ry, col) => { x.fillStyle = col; x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); x.fill() }
    // 浴衣
    x.fillStyle = '#4a6fc9'
    x.beginPath(); x.moveTo(180, 380); x.lineTo(332, 380); x.lineTo(380, 990); x.lineTo(132, 990); x.closePath(); x.fill()
    x.fillStyle = 'rgba(255,255,255,.85)'
    for (let i = 0; i < 18; i++) { const px = 160 + (i * 73) % 200, py = 450 + (i * 131) % 500; ell(px, py, 9, 9, 'rgba(255,255,255,.8)') }
    x.fillStyle = '#d94f4f'; x.fillRect(165, 560, 182, 46)                       // 帯
    x.fillStyle = '#fff3e8'; x.beginPath(); x.moveTo(256, 380); x.lineTo(226, 380); x.lineTo(256, 470); x.lineTo(286, 380); x.fill() // 衿
    // 腕（左は下ろし、右は手を振る）
    x.strokeStyle = '#4a6fc9'; x.lineCap = 'round'; x.lineWidth = 56
    x.beginPath(); x.moveTo(190, 410); x.lineTo(150, 640); x.stroke()
    x.beginPath(); x.moveTo(322, 410); x.lineTo(420, 270); x.stroke()
    ell(146, 668, 26, 26, '#ffe0c8'); ell(430, 238, 28, 28, '#ffe0c8')
    // 足
    ell(210, 1000, 34, 14, '#5a3b2b'); ell(302, 1000, 34, 14, '#5a3b2b')
    // 顔と髪
    ell(256, 330, 30, 40, '#ffe0c8')                                             // 首
    ell(256, 230, 120, 125, '#3a2a22')                                           // 後ろ髪
    ell(256, 250, 98, 104, '#ffe0c8')                                            // 顔
    x.fillStyle = '#3a2a22'; x.beginPath(); x.ellipse(256, 190, 104, 70, 0, Math.PI, 0); x.fill() // 前髪
    ell(218, 262, 12, 16, '#2b2b2b'); ell(294, 262, 12, 16, '#2b2b2b')            // 目
    ell(222, 256, 4, 5, '#fff'); ell(298, 256, 4, 5, '#fff')
    ell(196, 298, 18, 10, 'rgba(255,140,150,.7)'); ell(316, 298, 18, 10, 'rgba(255,140,150,.7)')
    x.strokeStyle = '#a0524f'; x.lineWidth = 5; x.beginPath(); x.arc(256, 300, 18, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke()
    // 頭のタオル
    x.fillStyle = '#ffffff'; x.fillRect(196, 98, 120, 40)
    x.strokeStyle = '#dddddd'; x.lineWidth = 3; x.strokeRect(196, 98, 120, 40)
    return c
  }

  // ---- 湯けむり ----
  // ふんわりした白い丸の画像を作って、たくさん浮かべる
  const makePuffTexture = () => {
    const c = document.createElement('canvas')
    c.width = c.height = 128
    const x = c.getContext('2d')
    const g = x.createRadialGradient(64, 64, 0, 64, 64, 64)
    g.addColorStop(0, 'rgba(255,255,255,0.9)')
    g.addColorStop(0.4, 'rgba(255,255,255,0.45)')
    g.addColorStop(1, 'rgba(255,255,255,0)')
    x.fillStyle = g
    x.fillRect(0, 0, 128, 128)
    const t = new THREE.CanvasTexture(c)
    t.colorSpace = THREE.SRGBColorSpace
    return t
  }
  const steam = {group: null, puffs: [], tex: null, nextIdle: 0}
  const STEAM_MAX = 60
  const initSteam = (parent) => {
    steam.tex = makePuffTexture()
    steam.group = new THREE.Group()
    parent.add(steam.group)
    for (let i = 0; i < STEAM_MAX; i++) {
      const m = new THREE.SpriteMaterial({map: steam.tex, transparent: true, depthWrite: false, opacity: 0})
      const sp = new THREE.Sprite(m)
      sp.visible = false
      steam.group.add(sp)
      steam.puffs.push({sp, life: 0, age: 0, vx: 0, vy: 0, vz: 0, s0: 0, s1: 0, peak: 0})
    }
  }
  const spawnPuff = (burst) => {
    const p = steam.puffs.find(q => q.life <= 0)
    if (!p) return
    const a = Math.random() * Math.PI * 2
    const r = burst ? 0.15 + Math.random() * 0.35 : Math.random() * 0.25
    p.sp.position.set(Math.cos(a) * r, burst ? Math.random() * 0.3 : 0.02, Math.sin(a) * r)
    p.vx = Math.cos(a) * (burst ? 0.25 : 0.03)
    p.vz = Math.sin(a) * (burst ? 0.25 : 0.03)
    p.vy = burst ? 0.35 + Math.random() * 0.5 : 0.12 + Math.random() * 0.12
    p.life = burst ? 1.6 + Math.random() * 1.0 : 3 + Math.random() * 1.5
    p.age = 0
    p.s0 = burst ? 0.25 : 0.12
    p.s1 = burst ? 0.9 + Math.random() * 0.5 : 0.5 + Math.random() * 0.3
    p.peak = burst ? 0.75 : 0.35
    p.sp.visible = true
  }
  const steamBurst = () => { for (let i = 0; i < 36; i++) spawnPuff(true) }
  const updateSteam = (dt, t) => {
    if (!steam.group) return
    if (t > steam.nextIdle) { spawnPuff(false); steam.nextIdle = t + 0.22 }   // 足元からずっと立ちのぼる
    for (const p of steam.puffs) {
      if (p.life <= 0) continue
      p.age += dt
      const k = p.age / p.life
      if (k >= 1) { p.life = 0; p.sp.visible = false; p.sp.material.opacity = 0; continue }
      p.sp.position.x += p.vx * dt
      p.sp.position.y += p.vy * dt
      p.sp.position.z += p.vz * dt
      p.vx *= 0.98; p.vz *= 0.98
      const s = p.s0 + (p.s1 - p.s0) * k
      p.sp.scale.set(s, s, 1)
      p.sp.material.opacity = p.peak * Math.min(1, k * 4) * (1 - k)   // ふわっと出て、ゆっくり消える
    }
  }
  let appearStart = -1   // キャラがふわっと現れるための時刻

  const PANEL_H = 1.55   // 等身大（約155cm）
  const makePanel = () => {
    const g = new THREE.Group()
    // 立ち絵の画像（背景が透明なPNG）。読み込めなければ仮のイラストを使う
    // 立ち絵の切り替え：通常は鹿教湯の子。URLの末尾に ?c=test で前の試作の子
    const IMG_FILE = {test: 'musume.png', chibi: 'chibi.png'}[CHAR_PARAM] || 'kakeyu.png'
    const mat = new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(drawGirl()), transparent: true, alphaTest: 0.1, side: THREE.DoubleSide})
    mat.map.colorSpace = THREE.SRGBColorSpace
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(1, PANEL_H), mat)
    panel.scale.x = PANEL_H * 700 / 1167
    panel.visible = false   // 画像が読み込めるまでは出さない（仮のイラストが一瞬見えないように）
    new THREE.TextureLoader().load(IMG_FILE, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace
      mat.map = tex
      mat.needsUpdate = true
      panel.scale.x = PANEL_H * tex.image.width / tex.image.height   // 画像の縦横比に合わせる
      panel.visible = true
    })
    panel.position.y = PANEL_H / 2
    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(0.3, 32),
      new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.25})
    )
    shadow.rotation.x = -Math.PI / 2
    shadow.position.y = 0.005
    shadow.scale.set(0.75, 0.45, 1)
    shadow.position.z = -0.06   // 足の真下〜少し後ろに影を置いて、浮いて見えないように
    g.add(panel, shadow)
    g.userData.panel = panel
    g.userData.mat = mat
    return g
  }

  const hintText = document.getElementById('hintText')
  const hint = document.getElementById('hint')
  const sizeLabel = document.getElementById('size')
  let character = null, char3d = null, char2d = null, mode = '2d', userScale = 1, pinched = false
  let placed = false, surface = null, cam = null, sceneRef = null
  const showSize = () => { sizeLabel.textContent = '身長 約' + Math.round(PANEL_H * userScale * 100) + 'cm' }
  // 大きさのモード：等身大（床に立つ）／卓上（テーブルに立つ約20cm）
  // スマホの高さを「床から1.4m」「テーブルから0.45m」と仮定して、だいたいの実寸に合わせる
  const SIZE_MODES = {
    life:  {camH: 1.4,  scale: 1,              hint: 'スマホをゆっくり左右に動かしてから、床をタップしてください（2本指で大きさを変えられます）', next: '卓上サイズにする'},
    table: {camH: 0.45, scale: 0.20 / PANEL_H, hint: 'テーブルを映したまま、スマホをゆっくり左右に動かしてから、テーブルをタップしてください', next: '等身大にする'},
  }
  // ちびキャラ（?c=chibi）は卓上サイズから始める
  let sizeMode = CHAR_PARAM === 'chibi' ? 'table' : 'life'
  if (sizeMode === 'table') userScale = SIZE_MODES.table.scale

  // ---- 床をタップしてキャラを置く ----
  const placeModule = () => ({
    name: 'place-character',
    onStart: ({canvasWidth, canvasHeight}) => {
      const {scene, camera, renderer} = XR8.Threejs.xrScene()
      sceneRef = scene; cam = camera
      renderer.shadowMap.enabled = true
      renderer.outputColorSpace = THREE.SRGBColorSpace

      scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.6))
      const sun = new THREE.DirectionalLight(0xffffff, 1.4)
      sun.position.set(1, 4, 2)
      scene.add(sun)

      surface = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({visible: false}))
      surface.rotation.x = -Math.PI / 2
      scene.add(surface)

      character = new THREE.Group()
      char3d = makeCharacter()
      char3d.scale.setScalar(PANEL_H / 1.15)   // 3Dの子も等身大に
      char2d = makePanel()
      character.add(char3d, char2d)
      char3d.visible = false
      character.visible = false
      scene.add(character)
      initSteam(character)

      // スマホを持つ高さ ≒ 1.4m として、単位をほぼメートルに合わせる
      camera.position.set(0, SIZE_MODES[sizeMode].camH, 0)
      XR8.XrController.updateCameraProjectionMatrix({
        origin: camera.position, facing: camera.quaternion,
      })
      hintText.textContent = SIZE_MODES[sizeMode].hint
      document.getElementById('sizeMode').textContent = SIZE_MODES[sizeMode].next
    },
    onUpdate: () => {
      if (!character || !character.visible) return
      const now = performance.now() / 1000
      const dt = Math.min(0.05, now - (placeModule.last || now))
      placeModule.last = now
      updateSteam(dt, now)
      // 湯けむりの中からふわっと現れる（2Dの立ち絵）
      if (appearStart >= 0) {
        const k = Math.min(1, (now - appearStart - 0.25) / 0.8)
        char2d.userData.mat.opacity = Math.max(0, k)
        if (k >= 1) appearStart = -1
      }
      const t = performance.now() / 1000
      char3d.userData.armR.rotation.z = 2.4 + Math.sin(t * 6) * 0.35   // 手を振る
      const p = char2d.userData.panel
      // 2Dはいつもカメラの方を向く（看板が横から見えて薄くならないように）
      // カメラの位置の細かいブレをそのまま拾うと震えて見えるので、ゆっくり追いかける
      if (mode === '2d') {
        const wp = character.position
        const target = Math.atan2(cam.position.x - wp.x, cam.position.z - wp.z)
        let diff = target - character.rotation.y
        diff = Math.atan2(Math.sin(diff), Math.cos(diff))
        if (Math.abs(diff) > 0.02) character.rotation.y += diff * Math.min(1, dt * 4)
      }
    },
  })

  const ray = new THREE.Raycaster()
  const placeAt = (x, y) => {
    if (!cam || !surface) return
    const p = new THREE.Vector2(x / window.innerWidth * 2 - 1, -(y / window.innerHeight) * 2 + 1)
    ray.setFromCamera(p, cam)
    // まず、カメラが見つけた実際の面（テーブルの上など）に置く。見つからなければ、床の面に置く
    let pt = null
    try {
      const hits = XR8.XrController.hitTest(x / window.innerWidth, y / window.innerHeight, ['FEATURE_POINT', 'ESTIMATED_SURFACE'])
      if (hits && hits.length) pt = new THREE.Vector3(hits[0].position.x, hits[0].position.y, hits[0].position.z)
    } catch (e) {}
    if (!pt) {
      const hit = ray.intersectObject(surface)
      if (!hit.length) return
      pt = hit[0].point.clone(); pt.y = 0
    }
    character.position.set(pt.x, pt.y, pt.z)
    // 卓上サイズは、カメラからの距離に合わせて大きさを決める（画面の高さの3割くらいに見える大きさ）
    // 距離の測り方が端末によってずれても、小さくなりすぎないように
    if (sizeMode === 'table' && !pinched) {
      const d = cam.position.distanceTo(pt)
      userScale = Math.min(0.6, Math.max(0.05, 0.35 * d / PANEL_H))
    }
    character.scale.setScalar(userScale)
    showSize()
    if (DEBUG) sizeLabel.style.display = 'block'
    // カメラの方を向かせる
    character.rotation.y = Math.atan2(cam.position.x - pt.x, cam.position.z - pt.z)
    character.visible = true
    char2d.userData.mat.opacity = 0
    appearStart = performance.now() / 1000
    steamBurst()
    placed = true
    hint.style.display = 'none'
  }

  // 1本指タップで置く／2本指でつまんで大きさを変える
  const feed = document.getElementById('camerafeed')
  let pinchStart = 0, scaleStart = 1
  const dist = (e) => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY)
  feed.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) { pinchStart = dist(e); scaleStart = userScale; pinched = true; return }
    if (e.touches.length !== 1 || placed) return
    placeAt(e.touches[0].clientX, e.touches[0].clientY)
  }, {passive: true})
  feed.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2 || !pinchStart || !placed) return
    userScale = Math.min(1.4, Math.max(0.05, scaleStart * dist(e) / pinchStart))
    character.scale.setScalar(userScale)
    showSize()
  }, {passive: true})
  feed.addEventListener('touchend', () => { pinchStart = 0 }, {passive: true})

  const sizeBtn = document.getElementById('sizeMode')
  sizeBtn.onclick = () => {
    if (!cam) return
    sizeMode = sizeMode === 'life' ? 'table' : 'life'
    const m = SIZE_MODES[sizeMode]
    userScale = m.scale; pinched = false
    // 置き直し：スマホの高さの想定を変えて、床（またはテーブル）を測り直す
    placed = false
    character.visible = false
    sizeLabel.style.display = 'none'
    cam.position.set(0, m.camH, 0)
    XR8.XrController.updateCameraProjectionMatrix({origin: cam.position, facing: cam.quaternion})
    XR8.XrController.recenter()
    sizeBtn.textContent = m.next
    hint.style.display = 'flex'
    hintText.textContent = m.hint
  }

  document.getElementById('reset').onclick = () => {
    placed = false
    if (character) character.visible = false
    hint.style.display = 'flex'
    hintText.textContent = SIZE_MODES[sizeMode].hint
  }
  const modeBtn = document.getElementById('mode')
  modeBtn.onclick = () => {
    mode = mode === '2d' ? '3d' : '2d'
    char2d.visible = mode === '2d'
    char3d.visible = mode === '3d'
    modeBtn.textContent = mode === '2d' ? '3Dにする' : '2Dにする'
    if (mode === '3d' && cam) {
      const wp = character.position
      character.rotation.y = Math.atan2(cam.position.x - wp.x, cam.position.z - wp.z)
    }
  }

  // ---- 写真を撮る ----
  let lastBlob = null
  const result = document.getElementById('result')
  const photo = document.getElementById('photo')
  document.getElementById('shutter').onclick = async () => {
    try {
      const b64 = await XR8.CanvasScreenshot.takeScreenshot()
      photo.src = 'data:image/jpeg;base64,' + b64
      const bin = atob(b64), arr = new Uint8Array(bin.length)
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i)
      lastBlob = new Blob([arr], {type: 'image/jpeg'})
      result.style.display = 'flex'
    } catch (err) {
      hint.style.display = 'flex'
      hintText.textContent = '撮影できませんでした：' + err
    }
  }
  document.getElementById('close').onclick = () => { result.style.display = 'none' }
  document.getElementById('share').onclick = async () => {
    if (!lastBlob) return
    const file = new File([lastBlob], 'ar-kinen.jpg', {type: 'image/jpeg'})
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file], title: 'AR記念写真'}) } catch (e) {}
    } else {
      const a = document.createElement('a')
      a.href = URL.createObjectURL(lastBlob)
      a.download = 'ar-kinen.jpg'
      a.click()
    }
  }

  // ---- 起動 ----
  const onxrloaded = () => {
    // ?abs=1 で実寸モード（スマホを少し動かして測ってから始まる。回り込んだときのズレが減る想定）
    XR8.XrController.configure({scale: new URLSearchParams(location.search).get('abs') === '1' ? 'absolute' : 'responsive'})
    XR8.addCameraPipelineModules([
      XR8.GlTextureRenderer.pipelineModule(),
      XR8.Threejs.pipelineModule(),
      XR8.XrController.pipelineModule(),
      XR8.CanvasScreenshot.pipelineModule(),
      XRExtras.FullWindowCanvas.pipelineModule(),
      XRExtras.Loading.pipelineModule(),
      XRExtras.RuntimeError.pipelineModule(),
      placeModule(),
    ])
    XR8.run({canvas: document.getElementById('camerafeed')})
  }
  const start = () => window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)
  const startAR = () => window.XRExtras ? start() : window.addEventListener('xrextrasloaded', start)

  // ---- 許可の案内 ----
  // 先に「何の確認が出るか」をまとめて見せ、ボタンを押してから順番に確認を出す
  // （動作と方向 → 位置情報 → カメラ の順。iPhoneの動作と方向は、ボタンを押したときにしか確認を出せない）
  const Q = new URLSearchParams(location.search)
  const GEO = Q.get('geo')
  const needMotion = typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'
  const steps = []
  if (needMotion) steps.push(['motion', '動作と方向', 'スマホの動きに合わせて、キャラクターをその場にとどめるために使います'])
  if (GEO) steps.push(['geo', '位置情報', '現地にいるかを確かめるために使います'])
  steps.push(['camera', 'カメラ', '景色にキャラクターを重ねて、写真を撮るために使います。写真は外に送りません'])
  const intro = document.getElementById('intro'), introList = document.getElementById('introList')
  introList.innerHTML = steps.map((st, i) => '<li id="st_' + st[0] + '"><b>' + (i + 1) + '．' + st[1] + '</b>' + st[2] + '</li>').join('')
  const mark = (id) => { steps.forEach(st => { const el = document.getElementById('st_' + st[0]); el.classList.remove('now'); if (st[0] === id) el.classList.add('now') }) }
  const done = (id) => { const el = document.getElementById('st_' + id); if (el) { el.classList.remove('now'); el.classList.add('done') } }

  const askMotion = async () => {
    if (!needMotion) return
    mark('motion')
    try { await DeviceMotionEvent.requestPermission() } catch (e) {}
    try { await DeviceOrientationEvent.requestPermission() } catch (e) {}
    done('motion')
  }
  const goCamera = () => { mark('camera'); intro.style.display = 'none'; startAR() }

  // ---- 位置情報のテスト（?geo=1）----
  // 初めて開いた場所を中心として、このスマホに記録する。中心から半径（?r=、標準300m）の外では体験できない
  // ?geo=reset で中心を消す（次に開いた場所が新しい中心になる）
  const geoCheck = (onInside) => {
    const KEY = 'webar_geo_center', R = Number(Q.get('r')) || 300
    if (GEO === 'reset') { try { localStorage.removeItem(KEY) } catch (e) {} }
    const gate = document.getElementById('geoGate'), gTitle = document.getElementById('geoTitle'),
          gMsg = document.getElementById('geoMsg'), gRetry = document.getElementById('geoRetry'),
          info = document.getElementById('geoInfo')
    const showGate = (t, m, retry) => { gate.style.display = 'flex'; gTitle.textContent = t; gMsg.innerHTML = m; gRetry.style.display = retry ? 'block' : 'none' }
    const meters = (a, b) => {
      const r = 6371000, k = Math.PI / 180
      const dLat = (b.lat - a.lat) * k, dLng = (b.lng - a.lng) * k
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * k) * Math.cos(b.lat * k) * Math.sin(dLng / 2) ** 2
      return 2 * r * Math.asin(Math.sqrt(h))
    }
    let center = null, inside = false, watchId = null
    try { center = JSON.parse(localStorage.getItem(KEY)) } catch (e) {}
    const onPos = (pos) => {
      const here = {lat: pos.coords.latitude, lng: pos.coords.longitude}, acc = Math.round(pos.coords.accuracy)
      if (!center) { center = here; try { localStorage.setItem(KEY, JSON.stringify(center)) } catch (e) {} }
      const d = Math.round(meters(center, here))
      if (DEBUG) info.style.display = 'block'
      info.textContent = '中心から ' + d + 'm（誤差 ±' + acc + 'm）／ 範囲 ' + R + 'm'
      if (d <= R) {
        gate.style.display = 'none'
        if (!inside) { inside = true; done('geo'); onInside() }
      } else {
        showGate('ここでは体験できません', '現地でのみ体験できます。' + (DEBUG ? '<br>中心から ' + d + 'm 離れています（範囲は ' + R + 'm 以内）' : ''), true)
      }
    }
    const onErr = (err) => {
      const m = err.code === 1
        ? '位置情報が許可されていません。<br>iPhoneの「設定」→「プライバシーとセキュリティ」→「位置情報サービス」で、使っているブラウザ（SafariまたはChrome）を「使用中のみ許可」にしてから、もう一度確認してください'
        : '位置を確認できませんでした。電波の良い場所で、もう一度確認してください'
      showGate('位置を確認できません', m, true)
    }
    const watch = () => {
      if (!navigator.geolocation) return showGate('位置を確認できません', 'このブラウザは位置情報に対応していません', false)
      if (watchId !== null) navigator.geolocation.clearWatch(watchId)
      watchId = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000})
    }
    gRetry.addEventListener('click', watch)
    mark('geo')
    watch()
  }

  document.getElementById('introStart').addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.textContent = '確認中…'
    // 動作と方向はボタンを押した直後でないと確認を出せないので、最初に出す
    await askMotion()
    if (GEO) geoCheck(goCamera); else goCamera()
  })
}
</script>
</body>
</html>
