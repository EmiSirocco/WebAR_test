<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五台橋 登場動画（試作）</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; }
  #ui { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 2; max-width: 240px; }
  #ui button { font-size: 14px; padding: 8px 12px; border: 0; border-radius: 6px; background: #2E6A55; color: #fff; cursor: pointer; text-align: left; }
  #ui button.sub { background: #444; }
  #ui button:disabled { opacity: .5; cursor: default; }
  #adjust { display: none; flex-direction: column; gap: 6px; }
  #msg { font-size: 13px; line-height: 1.5; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three/three.module.js",
    "three/addons/": "./lib/three/",
    "@sparkjsdev/spark": "./lib/spark/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="wrap"></div>
<div id="ui">
  <button id="play">▶ 再生</button>
  <button id="rec">● 録画して保存</button>
  <button id="adj" class="sub">カメラと立ち位置を調整</button>
  <div id="adjust">
    <button id="setStart" class="sub">いまの見え方を「始まり」に</button>
    <button id="setEnd" class="sub">いまの見え方を「終わり」に</button>
    <button id="place" class="sub">次にクリックした所に女の子を立たせる</button>
    <button id="reset" class="sub">最初の設定に戻す</button>
  </div>
  <div id="msg">読み込み中…</div>
</div>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark'

// ---- 動画の大きさ（スマホの縦長 9:16）----
const W = 1080, H = 1920
const DURATION = 10      // 動画の長さ（秒）
const MOVE_END = 6.5     // カメラが寄り終わる時間
const APPEAR_AT = 3.0    // 湯けむりが立つ時間
const PANEL_H = 1.55     // 女の子の身長（m）

const params = new URLSearchParams(location.search)
const msg = document.getElementById('msg')

// ---- 位置の設定（五台橋のデータの座標。上下を合わせて使う）----
const DEFAULTS = {
  start: { eye: [52, -6.5, 20], target: [42, -8.8, 2] },
  end:   { eye: [47.9, -8.95, 8.2], target: [46.5, -9.55, 3.8] },
  girl:  [46.5, -10.48, 4],
}
let conf = JSON.parse(JSON.stringify(DEFAULTS))
try { const s = localStorage.getItem('godai-conf'); if (s) conf = JSON.parse(s) } catch (e) {}
if (params.get('conf')) conf = Object.assign(conf, JSON.parse(params.get('conf')))
const saveConf = () => { try { localStorage.setItem('godai-conf', JSON.stringify(conf)) } catch (e) {} }

// ---- 画面 ----
const renderer = new THREE.WebGLRenderer({ antialias: false })
renderer.setPixelRatio(1)
renderer.setSize(W, H, false)
document.getElementById('wrap').appendChild(renderer.domElement)
const fit = () => {
  const s = Math.min(innerWidth / W, innerHeight / H)
  renderer.domElement.style.width = (W * s) + 'px'
  renderer.domElement.style.height = (H * s) + 'px'
}
fit(); addEventListener('resize', fit)

const scene = new THREE.Scene()
scene.background = new THREE.Color(0xdfe6e0)
const camera = new THREE.PerspectiveCamera(50, W / H, 0.05, 500)
const spark = new SparkRenderer({ renderer })
scene.add(spark)

// 五台橋（上下が逆さまのデータなので、ひっくり返して置く）
const bridge = new SplatMesh({ url: 'godaibashi.splat' })
bridge.quaternion.set(1, 0, 0, 0)
scene.add(bridge)

// ---- 女の子（立ち絵の板。いつもカメラの方を向く）----
const girl = new THREE.Group()
scene.add(girl)
const girlMat = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.1, side: THREE.DoubleSide, opacity: 0, depthWrite: true })
const panel = new THREE.Mesh(new THREE.PlaneGeometry(1, PANEL_H), girlMat)
panel.position.y = PANEL_H / 2
panel.visible = false
girl.add(panel)
new THREE.TextureLoader().load('kakeyu.png', (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace
  girlMat.map = tex; girlMat.needsUpdate = true
  panel.scale.x = PANEL_H * tex.image.width / tex.image.height
  panel.visible = true
})
const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.3, 32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthWrite: false }))
shadow.rotation.x = -Math.PI / 2
shadow.position.y = 0.01
shadow.scale.set(0.8, 0.5, 1)
girl.add(shadow)
const placeGirl = () => girl.position.set(...conf.girl)
placeGirl()

// ---- 湯けむり（ARと同じ作り）----
const puffTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128
  const x = c.getContext('2d')
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64)
  g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.4, 'rgba(255,255,255,0.45)'); g.addColorStop(1, 'rgba(255,255,255,0)')
  x.fillStyle = g; x.fillRect(0, 0, 128, 128)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t
})()
const steamGroup = new THREE.Group(); girl.add(steamGroup)
const puffs = []
for (let i = 0; i < 80; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, transparent: true, depthWrite: false, opacity: 0 }))
  sp.visible = false; steamGroup.add(sp)
  puffs.push({ sp, life: 0, age: 0, vx: 0, vy: 0, vz: 0, s0: 0, s1: 0, peak: 0 })
}
let nextIdle = 0
const spawn = (burst) => {
  const p = puffs.find(q => q.life <= 0); if (!p) return
  const a = Math.random() * Math.PI * 2
  const r = burst ? 0.15 + Math.random() * 0.4 : Math.random() * 0.3
  p.sp.position.set(Math.cos(a) * r, burst ? Math.random() * 0.4 : 0.02, Math.sin(a) * r)
  p.vx = Math.cos(a) * (burst ? 0.3 : 0.03); p.vz = Math.sin(a) * (burst ? 0.3 : 0.03)
  p.vy = burst ? 0.35 + Math.random() * 0.5 : 0.12 + Math.random() * 0.12
  p.life = burst ? 1.8 + Math.random() * 1.2 : 3 + Math.random() * 1.5
  p.age = 0; p.s0 = burst ? 0.3 : 0.12; p.s1 = burst ? 1.0 + Math.random() * 0.6 : 0.5 + Math.random() * 0.3
  p.peak = burst ? 0.8 : 0.35; p.sp.visible = true
}
const clearSteam = () => { for (const p of puffs) { p.life = 0; p.sp.visible = false } }
const updateSteam = (dt, t) => {
  if (t >= APPEAR_AT && t > nextIdle) { spawn(false); nextIdle = t + 0.2 }
  for (const p of puffs) {
    if (p.life <= 0) continue
    p.age += dt
    const k = p.age / p.life
    if (k >= 1) { p.life = 0; p.sp.visible = false; continue }
    p.sp.position.x += p.vx * dt; p.sp.position.y += p.vy * dt; p.sp.position.z += p.vz * dt
    p.vx *= 0.98; p.vz *= 0.98
    const s = p.s0 + (p.s1 - p.s0) * k
    p.sp.scale.set(s, s, 1)
    p.sp.material.opacity = p.peak * Math.min(1, k * 4) * (1 - k)
  }
}

// ---- カメラの動き ----
const v = (a) => new THREE.Vector3(...a)
const ease = (k) => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2
const setCam = (t) => {
  const k = ease(Math.min(1, t / MOVE_END))
  camera.position.copy(v(conf.start.eye).lerp(v(conf.end.eye), k))
  // 寄り終わったあとも、ほんの少しだけ動かして止まって見えないように
  const drift = Math.max(0, t - MOVE_END) * 0.03
  camera.position.x += drift
  camera.lookAt(v(conf.start.target).lerp(v(conf.end.target), k))
}

// ---- 再生 ----
let playing = false, t0 = 0, last = 0, burstDone = false, adjusting = false
const controls = new OrbitControls(camera, renderer.domElement)
controls.enabled = false

const start = () => {
  playing = true; burstDone = false; clearSteam(); nextIdle = 0
  t0 = performance.now() / 1000; last = t0
}
const frame = (tSec, dt) => {
  if (!burstDone && tSec >= APPEAR_AT) { for (let i = 0; i < 45; i++) spawn(true); burstDone = true }
  const a = Math.min(1, Math.max(0, (tSec - APPEAR_AT - 0.3) / 1.0))
  girlMat.opacity = a; shadow.material.opacity = 0.25 * a
  updateSteam(dt, tSec)
}
renderer.setAnimationLoop(() => {
  const now = performance.now() / 1000
  const dt = Math.min(0.05, now - last); last = now
  if (playing && !adjusting) {
    const t = now - t0
    setCam(t)
    frame(t, dt)
    if (t > DURATION) playing = false
  } else if (adjusting) {
    controls.update()
    girlMat.opacity = 1; shadow.material.opacity = 0.25
    updateSteam(dt, 999)
  }
  // 女の子はいつもカメラの方を向く
  girl.rotation.y = Math.atan2(camera.position.x - girl.position.x, camera.position.z - girl.position.z)
  renderer.render(scene, camera)
})

// 確認用：?t=秒 でその瞬間を表示したまま止める
const freezeT = params.get('t')
bridge.initialized.then(() => {
  msg.textContent = '準備できました。\n「再生」で流れを確認、「録画して保存」で動画ファイルになります。'
  if (freezeT !== null) {
    const T = parseFloat(freezeT)
    setCam(T)
    for (let s = 0; s <= T; s += 1 / 30) frame(s, 1 / 30)
    renderer.setAnimationLoop(() => { setCam(T); girl.rotation.y = Math.atan2(camera.position.x - girl.position.x, camera.position.z - girl.position.z); renderer.render(scene, camera) })
    document.title = 'ready'
  } else {
    start()
  }
})

document.getElementById('play').onclick = () => { if (adjusting) toggleAdjust(); start() }

// ---- 録画 ----
document.getElementById('rec').onclick = () => {
  if (adjusting) toggleAdjust()
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm']
  const type = types.find(x => MediaRecorder.isTypeSupported(x))
  const stream = renderer.domElement.captureStream(30)
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16_000_000 })
  const chunks = []
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data) }
  rec.onstop = () => {
    const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm'
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob(chunks, { type }))
    a.download = 'godaibashi_' + Date.now() + '.' + ext
    a.click()
    msg.textContent = '保存しました（' + ext + '）。ダウンロードフォルダを見てください。'
    document.getElementById('rec').disabled = false
  }
  document.getElementById('rec').disabled = true
  msg.textContent = '録画中…（' + DURATION + '秒）'
  start(); rec.start()
  setTimeout(() => rec.stop(), (DURATION + 0.3) * 1000)
}

// ---- 調整モード ----
const adjustBox = document.getElementById('adjust')
const showConf = () => {
  msg.textContent = 'マウス左ドラッグ：回す／右ドラッグ：移動／ホイール：寄る\n\n今の設定（こちらに送ってもらえれば反映します）\n' + JSON.stringify(conf)
}
const toggleAdjust = () => {
  adjusting = !adjusting
  controls.enabled = adjusting
  adjustBox.style.display = adjusting ? 'flex' : 'none'
  if (adjusting) {
    camera.position.copy(v(conf.end.eye)); controls.target.copy(v(conf.end.target)); controls.update()
    showConf()
  } else { msg.textContent = '' }
}
document.getElementById('adj').onclick = toggleAdjust
const r1 = (a) => a.toArray().map(x => Math.round(x * 100) / 100)
document.getElementById('setStart').onclick = () => { conf.start = { eye: r1(camera.position), target: r1(controls.target) }; saveConf(); showConf() }
document.getElementById('setEnd').onclick = () => { conf.end = { eye: r1(camera.position), target: r1(controls.target) }; saveConf(); showConf() }
document.getElementById('reset').onclick = () => { conf = JSON.parse(JSON.stringify(DEFAULTS)); saveConf(); placeGirl(); showConf() }
let placing = false
document.getElementById('place').onclick = () => { placing = true; msg.textContent = '女の子を立たせたい地面をクリックしてください' }
renderer.domElement.addEventListener('click', (e) => {
  if (!placing) return
  placing = false
  const r = renderer.domElement.getBoundingClientRect()
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1)
  const ray = new THREE.Raycaster(); ray.setFromCamera(ndc, camera)
  const hits = ray.intersectObject(bridge)
  if (hits.length) {
    conf.girl = r1(hits[0].point); saveConf(); placeGirl(); showConf()
  } else {
    msg.textContent = '地面が見つかりませんでした。もう一度「次にクリックした所に…」を押して、地面をクリックしてください'
  }
})
</script>
</body>
</html>
